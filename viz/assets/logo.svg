<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" fill="none">
  <title>Mtl food — map pin with Orange Julep dome</title>
  <!-- Map pin body: circle top, tapers to point -->
  <path d="M16 38 C14 32 4 24 4 14 A12 12 0 0 1 28 14 C28 24 18 32 16 38Z"
        stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Orange Julep dome inside the circle -->
  <path d="M8 15 A8 7 0 0 1 24 15"
        stroke="#E0523A" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Dome base -->
  <line x1="7" y1="15" x2="25" y2="15"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
